<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selbuvott — mitten chart maker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23EEEAE0'/><path d='M8 1 L13 6 V15 H3 V6 Z' fill='%2326221E'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEEAE0;
    --card: #F9F6EF;
    --ink: #26221E;
    --ink-soft: rgba(38, 34, 30, 0.55);
    --hairline: rgba(38, 34, 30, 0.16);
    --red: #9E3229;
    --wool-white: #F6F2E9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Jost", sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--hairline) 1px, transparent 1px),
      linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
    background-size: 28px 28px;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 1.6rem 1rem 1rem;
  }
  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    text-indent: 0.28em; /* balances the letterspacing on the last glyph */
  }
  header .rule {
    width: min(320px, 70%);
    margin: 0.55rem auto;
    border: 0;
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink);
    height: 4px;
  }
  header p {
    font-size: 0.85rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .workshop {
    display: flex;
    gap: 1.5rem;
    align-items: flex-start;
    justify-content: center;
    padding: 0 1rem 3rem;
    flex-wrap: wrap;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(38, 34, 30, 0.18);
    padding: 1.2rem 1.3rem;
    width: 250px;
    flex-shrink: 0;
  }
  .panel section + section {
    margin-top: 1.2rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--hairline);
  }
  .panel h2 {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 0.7rem;
  }

  .swatches { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .swatch {
    width: 34px; height: 34px;
    border: 1px solid var(--ink);
    cursor: pointer;
    position: relative;
    padding: 0;
  }
  .swatch.selected { outline: 2px solid var(--red); outline-offset: 2px; }
  .swatch-add {
    width: 34px; height: 34px;
    border: 1px dashed var(--ink-soft);
    background: transparent;
    color: var(--ink-soft);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
  }
  .swatch-add:hover { border-color: var(--ink); color: var(--ink); }

  .tools { display: flex; flex-direction: column; gap: 0.4rem; }
  .tool, .action {
    font-family: "Jost", sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    padding: 0.45rem 0.7rem;
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--ink);
    cursor: pointer;
  }
  .tool:hover, .action:hover { border-color: var(--ink); }
  .tool.selected {
    background: var(--ink);
    color: var(--card);
    border-color: var(--ink);
  }
  .tool small, .action small {
    color: inherit; opacity: 0.6;
    font-family: "IBM Plex Mono", monospace;
    white-space: nowrap;
  }

  .field { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.55rem; }
  .field label { font-size: 0.9rem; }
  .field input[type="number"] {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.9rem;
    width: 64px;
    padding: 0.3rem 0.4rem;
    border: 1px solid var(--hairline);
    background: var(--card);
    color: var(--ink);
    text-align: right;
  }
  .field input[type="number"]:focus { border-color: var(--ink); outline: none; }
  .check { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer; }
  .check input { accent-color: var(--red); width: 16px; height: 16px; }

  .actions { display: flex; flex-direction: column; gap: 0.4rem; }
  .action-row { display: flex; gap: 0.4rem; }
  .action-row .action { flex: 1; }
  .action.danger:hover { border-color: var(--red); color: var(--red); }
  .action:disabled { opacity: 0.4; cursor: default; }
  .action:disabled:hover { border-color: var(--hairline); color: var(--ink); }

  .chart-card {
    background: var(--card);
    border: 1px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(38, 34, 30, 0.18);
    padding: 1.1rem 1.1rem 0.8rem;
    max-width: 100%;
  }
  .chart-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 0.7rem;
    margin-bottom: 0.9rem;
  }

  .side-tabs { display: flex; gap: 0.4rem; }
  .side-tab {
    font-family: "Jost", sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 0.4rem 0.8rem;
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .side-tab:hover { border-color: var(--ink); color: var(--ink); }
  .side-tab.selected {
    background: var(--ink);
    color: var(--card);
    border-color: var(--ink);
  }

  .zoom {
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .zoom button {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.85rem;
    width: 28px; height: 28px;
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--ink);
    cursor: pointer;
  }
  .zoom button.zoom-fit { width: auto; padding: 0 0.55rem; font-family: "Jost", sans-serif; letter-spacing: 0.1em; font-size: 0.72rem; text-transform: uppercase; }
  .zoom button:hover { border-color: var(--ink); }
  #zoomPct {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--ink-soft);
    min-width: 44px;
    text-align: center;
  }

  .chart-scroll {
    overflow: auto;
    max-width: 100%;
  }
  #chart {
    display: block;
    margin: 0 auto; /* centered until it overflows, then the wrapper scrolls */
    touch-action: none;
    cursor: crosshair;
  }
  .chart-foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
    padding: 0.6rem 0 0.2rem;
  }
  #counts { font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; color: var(--ink); }
  .chart-hint {
    font-size: 0.78rem;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  footer {
    text-align: center;
    padding: 0 1rem 2rem;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
  }

  button:focus-visible, input:focus-visible, label:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 2px;
  }

  @media (max-width: 720px) {
    .workshop { flex-direction: column; align-items: stretch; }
    .panel { width: 100%; }
    .swatch, .swatch-add { width: 40px; height: 40px; }
  }
</style>
</head>
<body>

<header>
  <h1>Selbuvott</h1>
  <hr class="rule">
  <p>Mitten chart maker &middot; strikkemønster</p>
</header>

<div class="workshop">
  <aside class="panel">
    <section>
      <h2>Yarn</h2>
      <div class="swatches" id="swatches"></div>
      <input type="color" id="customColor" value="#9E3229" hidden>
    </section>

    <section>
      <h2>Tool</h2>
      <div class="tools">
        <button class="tool selected" id="tool-paint" data-tool="paint">Knit <small>1</small></button>
        <button class="tool" id="tool-erase" data-tool="erase">Erase <small>2</small></button>
        <button class="tool" id="tool-rose" data-tool="rose">Selburose stamp <small>3</small></button>
      </div>
    </section>

    <section>
      <h2>Chart</h2>
      <div class="field">
        <label for="stitches">Stitches wide</label>
        <input type="number" id="stitches" min="9" max="61" step="2" value="27">
      </div>
      <div class="field">
        <label for="bodyRows">Rows before tip</label>
        <input type="number" id="bodyRows" min="4" max="90" value="34">
      </div>
      <label class="check"><input type="checkbox" id="mirror" checked> Mirror left &harr; right</label>
    </section>

    <section>
      <h2>Actions</h2>
      <div class="actions">
        <div class="action-row">
          <button class="action" id="undo">Undo <small>&#8963;Z</small></button>
          <button class="action" id="redo">Redo <small>&#8963;Y</small></button>
        </div>
        <button class="action" id="download">Download PNG <small>side</small></button>
        <button class="action" id="exportPdf">Export PDF <small>both</small></button>
        <button class="action danger" id="clear">Clear this side</button>
      </div>
    </section>
  </aside>

  <main class="chart-card">
    <div class="chart-title">
      <div class="side-tabs" role="tablist" aria-label="Mitten side">
        <button class="side-tab selected" id="tab-front" data-side="front" role="tab" aria-selected="true">Front &middot; back of hand</button>
        <button class="side-tab" id="tab-back" data-side="back" role="tab" aria-selected="false">Back &middot; palm</button>
      </div>
      <div class="zoom">
        <button id="zoomOut" aria-label="Zoom out">&minus;</button>
        <span id="zoomPct">100%</span>
        <button id="zoomIn" aria-label="Zoom in">+</button>
        <button id="zoomFit" class="zoom-fit" aria-label="Fit whole mitten in view">Fit</button>
      </div>
    </div>
    <div class="chart-scroll" id="chartScroll">
      <canvas id="chart"></canvas>
    </div>
    <div class="chart-foot">
      <span id="counts"></span>
      <span class="chart-hint">Drag to knit &middot; right-click erases &middot; F flips side &middot; autosaves</span>
    </div>
  </main>
</div>

<footer>Charted in the tradition of Selbu, Norway &mdash; read from the bottom up.</footer>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "selbuvott-chart-v1";
  var WOOL_WHITE = "#F6F2E9";
  var DEFAULT_YARNS = ["#26221E", "#9E3229", "#2E4A62"];
  var SIDE_LABELS = { front: "Front (back of hand)", back: "Back (palm)" };

  // 8-petal selburose, 15x15
  var ROSE = [
    ".......#.......",
    "......###......",
    "...#.#####.#...",
    "..###.###.###..",
    "...#...#...#...",
    "..#....#....#..",
    ".###..###..###.",
    "###############",
    ".###..###..###.",
    "..#....#....#..",
    "...#...#...#...",
    "..###.###.###..",
    "...#.#####.#...",
    "......###......",
    ".......#......."
  ];

  var state = {
    stitches: 27,
    bodyRows: 34,
    mirror: true,
    yarns: DEFAULT_YARNS.slice(),
    activeYarn: 0,
    tool: "paint",
    side: "front",
    // each side: cells keyed "rowFromBottom,col" -> hex color (absent = wool white)
    sides: { front: {}, back: {} }
  };

  var undoStack = [];
  var redoStack = [];
  var currentStroke = null;
  var zoom = 1; // 1 = whole mitten fits the window

  var canvas = document.getElementById("chart");
  var ctx = canvas.getContext("2d");
  var cellPx = 18;
  var RULER = 26; // px reserved for stitch/row numbers

  function cells() { return state.sides[state.side]; }
  function tipRows() { return Math.floor((state.stitches - 1) / 2); }
  function totalRows() { return state.bodyRows + tipRows(); }

  // A row (counted from the bottom) narrows by one stitch each side inside the tip.
  function insetFor(rowFromBottom) {
    var intoTip = rowFromBottom - state.bodyRows + 1;
    return intoTip > 0 ? intoTip : 0;
  }
  function inShape(rowFromBottom, col) {
    if (rowFromBottom < 0 || rowFromBottom >= totalRows()) return false;
    var inset = insetFor(rowFromBottom);
    return col >= inset && col < state.stitches - inset;
  }

  // ---- persistence ----
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        stitches: state.stitches,
        bodyRows: state.bodyRows,
        mirror: state.mirror,
        yarns: state.yarns,
        activeYarn: state.activeYarn,
        side: state.side,
        sides: state.sides
      }));
    } catch (e) { /* private browsing: chart just won't persist */ }
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (typeof d.stitches === "number") state.stitches = d.stitches;
      if (typeof d.bodyRows === "number") state.bodyRows = d.bodyRows;
      if (typeof d.mirror === "boolean") state.mirror = d.mirror;
      if (Array.isArray(d.yarns) && d.yarns.length) state.yarns = d.yarns;
      if (typeof d.activeYarn === "number" && d.activeYarn < state.yarns.length) state.activeYarn = d.activeYarn;
      if (d.sides && typeof d.sides === "object") {
        state.sides.front = d.sides.front || {};
        state.sides.back = d.sides.back || {};
      } else if (d.cells && typeof d.cells === "object") {
        state.sides.front = d.cells; // older save format had a single chart
      }
      if (d.side === "front" || d.side === "back") state.side = d.side;
    } catch (e) { /* corrupt save: start fresh */ }
  }

  // ---- drawing ----
  function fitCellSize() {
    var W = state.stitches, R = totalRows();
    var availW = Math.min(document.body.clientWidth - 40, 920) - RULER - 44;
    var card = document.querySelector(".chart-card");
    var availH = window.innerHeight - card.offsetTop - 150 - RULER;
    if (availH < 160) availH = 160;
    var fit = Math.min(availW / W, availH / R);
    cellPx = Math.max(4, Math.min(44, Math.floor(fit * zoom)));
    document.getElementById("zoomPct").textContent = Math.round(zoom * 100) + "%";
  }

  function draw() {
    fitCellSize();
    var W = state.stitches, R = totalRows();
    var cssW = W * cellPx + RULER + 2;
    var cssH = R * cellPx + RULER + 2;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    var ox = 1, oy = 1;
    var grid = cells();

    for (var rTop = 0; rTop < R; rTop++) {
      var rb = R - 1 - rTop; // row counted from the bottom
      for (var c = 0; c < W; c++) {
        if (!inShape(rb, c)) continue;
        var color = grid[rb + "," + c] || WOOL_WHITE;
        ctx.fillStyle = color;
        ctx.fillRect(ox + c * cellPx, oy + rTop * cellPx, cellPx, cellPx);
      }
    }

    // grid lines clipped to the mitten shape; every 5th line heavier, chart-style
    for (rTop = 0; rTop < R; rTop++) {
      var rb2 = R - 1 - rTop;
      var inset = insetFor(rb2);
      var x0 = ox + inset * cellPx;
      var x1 = ox + (W - inset) * cellPx;
      var y0 = oy + rTop * cellPx;
      for (var cc = inset; cc <= W - inset; cc++) {
        var heavy = (cc === inset || cc === W - inset || (cc % 5 === 0 && cc > inset && cc < W - inset));
        ctx.fillStyle = heavy ? "rgba(38,34,30,0.55)" : "rgba(38,34,30,0.18)";
        ctx.fillRect(ox + cc * cellPx - 0.5, y0, 1, cellPx);
      }
      var rowHeavy = (rb2 % 5 === 0) || rb2 === 0;
      ctx.fillStyle = rowHeavy ? "rgba(38,34,30,0.55)" : "rgba(38,34,30,0.18)";
      ctx.fillRect(x0, y0 - 0.5, x1 - x0, 1);
      if (rTop === R - 1) {
        ctx.fillStyle = "rgba(38,34,30,0.55)";
        ctx.fillRect(x0, y0 + cellPx - 0.5, x1 - x0, 1);
      }
    }

    // outline of the whole mitten
    ctx.strokeStyle = "#26221E";
    ctx.lineWidth = 1.5;
    ctx.stroke(shapePath(ox, oy, cellPx));

    // rulers: stitch numbers along the bottom, row numbers up the right side
    ctx.fillStyle = "rgba(38,34,30,0.7)";
    ctx.font = "500 " + Math.max(8, Math.min(11, cellPx - 6)) + "px 'IBM Plex Mono', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    for (var s = 5; s <= W; s += 5) {
      // stitch 1 is at the right edge, chart convention
      ctx.fillText(String(s), ox + (W - s) * cellPx + cellPx / 2, oy + R * cellPx + 6);
    }
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    for (var rn = 5; rn <= R; rn += 5) {
      var yy = oy + (R - rn) * cellPx + cellPx / 2;
      ctx.fillText(String(rn), ox + W * cellPx + 6, yy);
    }

    document.getElementById("counts").textContent =
      (state.side === "front" ? "front" : "back") + " · " +
      W + " sts × " + R + " rows (tip " + tipRows() + ")";
    updateHistoryButtons();
  }

  function shapePath(ox, oy, cs) {
    var W = state.stitches, R = totalRows(), T = tipRows();
    var p = new Path2D();
    // start bottom-left, go up the left side, staircase over the tip, down the right
    p.moveTo(ox, oy + R * cs);
    p.lineTo(ox, oy + T * cs);
    for (var i = 0; i < T; i++) {
      p.lineTo(ox + i * cs, oy + (T - i) * cs);
      p.lineTo(ox + (i + 1) * cs, oy + (T - i) * cs);
    }
    p.lineTo(ox + T * cs, oy);
    p.lineTo(ox + (W - T) * cs, oy);
    for (var j = T; j > 0; j--) {
      p.lineTo(ox + (W - j) * cs, oy + (T - j + 1) * cs);
      p.lineTo(ox + (W - j + 1) * cs, oy + (T - j + 1) * cs);
    }
    p.lineTo(ox + W * cs, oy + R * cs);
    p.closePath();
    return p;
  }

  // ---- editing ----
  function setCell(rb, col, color) {
    if (!inShape(rb, col)) return;
    var key = rb + "," + col;
    var grid = cells();
    var prev = grid[key] || null;
    var next = color;
    if (prev === next) return;
    if (currentStroke) currentStroke.changes.push({ key: key, prev: prev, next: next });
    if (next === null) delete grid[key];
    else grid[key] = next;
  }

  function applyAt(rb, col) {
    var color = state.tool === "erase" ? null : state.yarns[state.activeYarn];
    if (state.tool === "rose") return; // rose stamps on click only
    setCell(rb, col, color);
    if (state.mirror) setCell(rb, state.stitches - 1 - col, color);
  }

  function stampRose(rb, col) {
    var color = state.yarns[state.activeYarn];
    var half = Math.floor(ROSE.length / 2);
    for (var r = 0; r < ROSE.length; r++) {
      for (var c = 0; c < ROSE[r].length; c++) {
        if (ROSE[r][c] !== "#") continue;
        setCell(rb + (half - r), col + (c - half), color);
      }
    }
    if (state.mirror) {
      var mc = state.stitches - 1 - col;
      if (mc !== col) {
        for (r = 0; r < ROSE.length; r++) {
          for (c = 0; c < ROSE[r].length; c++) {
            if (ROSE[r][c] !== "#") continue;
            setCell(rb + (half - r), mc + (c - half), color);
          }
        }
      }
    }
  }

  function cellFromEvent(ev) {
    var rect = canvas.getBoundingClientRect();
    var scale = rect.width > 0 ? (parseFloat(canvas.style.width) / rect.width) : 1;
    var x = (ev.clientX - rect.left) * scale - 1;
    var y = (ev.clientY - rect.top) * scale - 1;
    var col = Math.floor(x / cellPx);
    var rTop = Math.floor(y / cellPx);
    return { rb: totalRows() - 1 - rTop, col: col };
  }

  var painting = false;
  var erasingDrag = false;
  var lastCell = null;

  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    currentStroke = { side: state.side, changes: [] };
    var cell = cellFromEvent(e);
    if (state.tool === "rose" && e.button !== 2) {
      stampRose(cell.rb, cell.col);
      endStroke();
      draw(); save();
      return;
    }
    painting = true;
    erasingDrag = (e.button === 2);
    lastCell = cell;
    paintCell(cell);
    draw();
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!painting) return;
    var cell = cellFromEvent(e);
    if (lastCell && cell.rb === lastCell.rb && cell.col === lastCell.col) return;
    // interpolate so fast drags leave no gaps
    var steps = Math.max(Math.abs(cell.rb - lastCell.rb), Math.abs(cell.col - lastCell.col));
    for (var i = 1; i <= steps; i++) {
      paintCell({
        rb: Math.round(lastCell.rb + (cell.rb - lastCell.rb) * i / steps),
        col: Math.round(lastCell.col + (cell.col - lastCell.col) * i / steps)
      });
    }
    lastCell = cell;
    draw();
  });

  function paintCell(cell) {
    if (erasingDrag) {
      setCell(cell.rb, cell.col, null);
      if (state.mirror) setCell(cell.rb, state.stitches - 1 - cell.col, null);
    } else {
      applyAt(cell.rb, cell.col);
    }
  }

  function endStroke() {
    if (currentStroke && currentStroke.changes.length) {
      undoStack.push(currentStroke);
      if (undoStack.length > 200) undoStack.shift();
      redoStack = [];
    }
    currentStroke = null;
    updateHistoryButtons();
  }

  window.addEventListener("pointerup", function () {
    if (!painting && !currentStroke) return;
    painting = false;
    erasingDrag = false;
    lastCell = null;
    endStroke();
    save();
  });

  function updateHistoryButtons() {
    document.getElementById("undo").disabled = undoStack.length === 0;
    document.getElementById("redo").disabled = redoStack.length === 0;
  }

  function showSideOf(stroke) {
    if (stroke.side !== state.side) setSide(stroke.side, true);
  }

  function undo() {
    var stroke = undoStack.pop();
    if (!stroke) return;
    showSideOf(stroke);
    var grid = state.sides[stroke.side];
    for (var i = stroke.changes.length - 1; i >= 0; i--) {
      var ch = stroke.changes[i];
      if (ch.prev === null) delete grid[ch.key];
      else grid[ch.key] = ch.prev;
    }
    redoStack.push(stroke);
    draw(); save();
  }

  function redo() {
    var stroke = redoStack.pop();
    if (!stroke) return;
    showSideOf(stroke);
    var grid = state.sides[stroke.side];
    for (var i = 0; i < stroke.changes.length; i++) {
      var ch = stroke.changes[i];
      if (ch.next === null) delete grid[ch.key];
      else grid[ch.key] = ch.next;
    }
    undoStack.push(stroke);
    draw(); save();
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === "z" && !e.shiftKey) { e.preventDefault(); undo(); return; }
    if ((e.ctrlKey || e.metaKey) && (k === "y" || (k === "z" && e.shiftKey))) { e.preventDefault(); redo(); return; }
    if (e.target.tagName === "INPUT") return;
    if (e.key === "1") selectTool("paint");
    if (e.key === "2") selectTool("erase");
    if (e.key === "3") selectTool("rose");
    if (k === "f") setSide(state.side === "front" ? "back" : "front");
  });

  // ---- sides ----
  function setSide(side, skipDraw) {
    state.side = side;
    document.querySelectorAll(".side-tab").forEach(function (b) {
      var on = b.dataset.side === side;
      b.classList.toggle("selected", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    if (!skipDraw) { draw(); save(); }
  }
  document.querySelectorAll(".side-tab").forEach(function (b) {
    b.addEventListener("click", function () { setSide(b.dataset.side); });
  });

  // ---- zoom ----
  function setZoom(z) {
    zoom = Math.max(0.5, Math.min(5, z));
    draw();
  }
  document.getElementById("zoomIn").addEventListener("click", function () { setZoom(zoom * 1.25); });
  document.getElementById("zoomOut").addEventListener("click", function () { setZoom(zoom / 1.25); });
  document.getElementById("zoomFit").addEventListener("click", function () { setZoom(1); });

  // ---- controls ----
  function renderSwatches() {
    var box = document.getElementById("swatches");
    box.innerHTML = "";
    state.yarns.forEach(function (color, i) {
      var b = document.createElement("button");
      b.className = "swatch" + (i === state.activeYarn ? " selected" : "");
      b.style.background = color;
      b.title = color;
      b.setAttribute("aria-label", "Yarn " + color);
      b.addEventListener("click", function () {
        state.activeYarn = i;
        if (state.tool === "erase") selectTool("paint");
        renderSwatches(); save();
      });
      box.appendChild(b);
    });
    var add = document.createElement("button");
    add.className = "swatch-add";
    add.textContent = "+";
    add.title = "Add a yarn color";
    add.setAttribute("aria-label", "Add a yarn color");
    add.addEventListener("click", function () {
      var picker = document.getElementById("customColor");
      picker.onchange = function () {
        state.yarns.push(picker.value);
        state.activeYarn = state.yarns.length - 1;
        renderSwatches(); save();
      };
      picker.click();
    });
    box.appendChild(add);
  }

  function selectTool(tool) {
    state.tool = tool;
    document.querySelectorAll(".tool").forEach(function (b) {
      b.classList.toggle("selected", b.dataset.tool === tool);
    });
  }
  document.querySelectorAll(".tool").forEach(function (b) {
    b.addEventListener("click", function () { selectTool(b.dataset.tool); });
  });

  var stitchesInput = document.getElementById("stitches");
  var bodyRowsInput = document.getElementById("bodyRows");
  var mirrorInput = document.getElementById("mirror");

  stitchesInput.addEventListener("change", function () {
    var v = Math.max(9, Math.min(61, Math.round(Number(stitchesInput.value) || 27)));
    if (v % 2 === 0) v += 1; // odd width keeps a center stitch for the rose
    stitchesInput.value = v;
    resizeChart(v, state.bodyRows);
  });
  bodyRowsInput.addEventListener("change", function () {
    var v = Math.max(4, Math.min(90, Math.round(Number(bodyRowsInput.value) || 34)));
    bodyRowsInput.value = v;
    resizeChart(state.stitches, v);
  });
  mirrorInput.addEventListener("change", function () {
    state.mirror = mirrorInput.checked;
    save();
  });

  // Re-center columns when the width changes; rows stay anchored at the cast-on edge.
  function resizeChart(newStitches, newBodyRows) {
    var shift = Math.floor((newStitches - state.stitches) / 2);
    var movedSides = {};
    Object.keys(state.sides).forEach(function (side) {
      var moved = {};
      Object.keys(state.sides[side]).forEach(function (key) {
        var parts = key.split(",");
        var rb = Number(parts[0]), col = Number(parts[1]) + shift;
        moved[rb + "," + col] = state.sides[side][key];
      });
      movedSides[side] = moved;
    });
    state.stitches = newStitches;
    state.bodyRows = newBodyRows;
    Object.keys(movedSides).forEach(function (side) {
      state.sides[side] = {};
      Object.keys(movedSides[side]).forEach(function (key) {
        var parts = key.split(",");
        if (inShape(Number(parts[0]), Number(parts[1]))) state.sides[side][key] = movedSides[side][key];
      });
    });
    undoStack = [];
    redoStack = [];
    draw(); save();
  }

  document.getElementById("undo").addEventListener("click", undo);
  document.getElementById("redo").addEventListener("click", redo);

  document.getElementById("clear").addEventListener("click", function () {
    if (!Object.keys(cells()).length) return;
    if (!window.confirm("Clear the " + SIDE_LABELS[state.side].toLowerCase() + " chart? This can't be undone.")) return;
    state.sides[state.side] = {};
    undoStack = undoStack.filter(function (s) { return s.side !== state.side; });
    redoStack = redoStack.filter(function (s) { return s.side !== state.side; });
    draw(); save();
  });

  // ---- export: PNG (current side) ----
  document.getElementById("download").addEventListener("click", function () {
    var cs = 24, pad = 24;
    var W = state.stitches, R = totalRows();
    var out = document.createElement("canvas");
    out.width = W * cs + pad * 2;
    out.height = R * cs + pad * 2;
    var octx = out.getContext("2d");
    octx.fillStyle = "#FFFFFF";
    octx.fillRect(0, 0, out.width, out.height);
    var grid = cells();
    for (var rTop = 0; rTop < R; rTop++) {
      var rb = R - 1 - rTop;
      for (var c = 0; c < W; c++) {
        if (!inShape(rb, c)) continue;
        octx.fillStyle = grid[rb + "," + c] || WOOL_WHITE;
        octx.fillRect(pad + c * cs, pad + rTop * cs, cs, cs);
        octx.strokeStyle = "rgba(38,34,30,0.25)";
        octx.lineWidth = 1;
        octx.strokeRect(pad + c * cs + 0.5, pad + rTop * cs + 0.5, cs - 1, cs - 1);
      }
    }
    octx.strokeStyle = "#26221E";
    octx.lineWidth = 2;
    octx.stroke(shapePath(pad, pad, cs));
    var a = document.createElement("a");
    a.download = "selbuvott-" + state.side + ".png";
    a.href = out.toDataURL("image/png");
    a.click();
  });

  // ---- export: PDF (both sides, hand-built vector PDF, no libraries) ----
  function hexToPdfColor(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255;
    var g = parseInt(hex.slice(3, 5), 16) / 255;
    var b = parseInt(hex.slice(5, 7), 16) / 255;
    return r.toFixed(4) + " " + g.toFixed(4) + " " + b.toFixed(4);
  }
  function pdfEscape(s) {
    return s.replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
  }
  function n2(v) { return (Math.round(v * 100) / 100).toString(); }

  function pdfPageContent(sideKey, label) {
    var W = state.stitches, R = totalRows(), T = tipRows(), B = state.bodyRows;
    var pageW = 595.28, pageH = 841.89, margin = 56, titleBlock = 60;
    var cs = Math.min((pageW - 2 * margin) / W, (pageH - 2 * margin - titleBlock) / R);
    var chartW = W * cs;
    var ox = (pageW - chartW) / 2;
    var oy = margin;
    var grid = state.sides[sideKey];
    var ops = [];

    // title block, leaflet style
    ops.push("BT /F1 16 Tf 1 0 0 1 " + n2(margin) + " " + n2(pageH - margin + 10) + " Tm 3 Tc (SELBUVOTT) Tj ET");
    ops.push("BT /F1 9 Tf 1 0 0 1 " + n2(margin) + " " + n2(pageH - margin - 6) + " Tm 1 Tc (" +
      pdfEscape(label.toUpperCase()) + ") Tj ET");
    ops.push("BT /F1 8 Tf 1 0 0 1 " + n2(margin) + " " + n2(pageH - margin - 18) + " Tm 0.5 Tc (" +
      W + " STS x " + R + " ROWS - TIP " + T + " - READ BOTTOM UP, STITCH 1 AT RIGHT) Tj ET");
    ops.push("0.149 0.133 0.118 RG 1 w " +
      n2(margin) + " " + n2(pageH - margin - 26) + " m " + n2(pageW - margin) + " " + n2(pageH - margin - 26) + " l S");

    // cells (y-up: row rb sits at oy + rb*cs)
    for (var rb = 0; rb < R; rb++) {
      for (var c = 0; c < W; c++) {
        if (!inShape(rb, c)) continue;
        var color = grid[rb + "," + c] || WOOL_WHITE;
        ops.push(hexToPdfColor(color) + " rg " +
          n2(ox + c * cs) + " " + n2(oy + rb * cs) + " " + n2(cs) + " " + n2(cs) + " re f");
      }
    }

    // grid lines, light with a heavier line every 5 stitches/rows
    var light = "0.78 0.76 0.73 RG 0.4 w";
    var heavy = "0.45 0.43 0.40 RG 0.8 w";
    var lightOps = [], heavyOps = [];
    for (rb = 0; rb < R; rb++) {
      var inset = insetFor(rb);
      var y0 = oy + rb * cs, y1 = y0 + cs;
      for (var cc = inset; cc <= W - inset; cc++) {
        var x = ox + cc * cs;
        var seg = n2(x) + " " + n2(y0) + " m " + n2(x) + " " + n2(y1) + " l S";
        (cc % 5 === 0 && cc > inset && cc < W - inset ? heavyOps : lightOps).push(seg);
      }
      var xa = ox + inset * cs, xb = ox + (W - inset) * cs;
      var hseg = n2(xa) + " " + n2(y0) + " m " + n2(xb) + " " + n2(y0) + " l S";
      (rb % 5 === 0 && rb > 0 ? heavyOps : lightOps).push(hseg);
    }
    ops.push(light); ops.push.apply(ops, lightOps);
    ops.push(heavy); ops.push.apply(ops, heavyOps);

    // mitten outline: up the left, staircase over the tip, down the right
    var pts = [[0, 0], [0, B]];
    for (var k = 1; k <= T; k++) { pts.push([k, B + k - 1]); pts.push([k, B + k]); }
    for (k = T; k >= 1; k--) { pts.push([W - k, B + k]); pts.push([W - k, B + k - 1]); }
    pts.push([W, B]); pts.push([W, 0]);
    var path = pts.map(function (p, i) {
      return n2(ox + p[0] * cs) + " " + n2(oy + p[1] * cs) + " " + (i === 0 ? "m" : "l");
    }).join(" ");
    ops.push("0.149 0.133 0.118 RG 1.4 w " + path + " h S");

    // stitch numbers along the bottom (stitch 1 at the right), row numbers at the right
    ops.push("0.35 0.33 0.30 rg");
    for (var s = 5; s <= W; s += 5) {
      var tx = ox + (W - s) * cs + cs / 2 - 3;
      ops.push("BT /F1 7 Tf 1 0 0 1 " + n2(tx) + " " + n2(oy - 12) + " Tm (" + s + ") Tj ET");
    }
    for (var rn = 5; rn <= R; rn += 5) {
      var ty = oy + (rn - 1) * cs + cs / 2 - 2.5;
      ops.push("BT /F1 7 Tf 1 0 0 1 " + n2(ox + W * cs + 6) + " " + n2(ty) + " Tm (" + rn + ") Tj ET");
    }

    return ops.join("\n");
  }

  function buildPdf() {
    var pages = [
      pdfPageContent("front", SIDE_LABELS.front),
      pdfPageContent("back", SIDE_LABELS.back)
    ];
    var objects = [];
    objects.push("<</Type/Catalog/Pages 2 0 R>>");                       // 1
    objects.push("<</Type/Pages/Kids[3 0 R 5 0 R]/Count 2>>");           // 2
    var pageDict = "<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]" +
      "/Resources<</Font<</F1 7 0 R>>>>/Contents ";
    objects.push(pageDict + "4 0 R>>");                                  // 3
    objects.push("<</Length " + pages[0].length + ">>\nstream\n" + pages[0] + "\nendstream"); // 4
    objects.push(pageDict + "6 0 R>>");                                  // 5
    objects.push("<</Length " + pages[1].length + ">>\nstream\n" + pages[1] + "\nendstream"); // 6
    objects.push("<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>");     // 7

    var pdf = "%PDF-1.4\n";
    var offsets = [];
    objects.forEach(function (body, i) {
      offsets.push(pdf.length);
      pdf += (i + 1) + " 0 obj\n" + body + "\nendobj\n";
    });
    var xrefStart = pdf.length;
    pdf += "xref\n0 " + (objects.length + 1) + "\n0000000000 65535 f \n";
    offsets.forEach(function (off) {
      pdf += ("0000000000" + off).slice(-10) + " 00000 n \n";
    });
    pdf += "trailer\n<</Size " + (objects.length + 1) + "/Root 1 0 R>>\nstartxref\n" + xrefStart + "\n%%EOF";
    return pdf;
  }

  document.getElementById("exportPdf").addEventListener("click", function () {
    var pdf = buildPdf();
    var bytes = new Uint8Array(pdf.length);
    for (var i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
    var blob = new Blob([bytes], { type: "application/pdf" });
    var a = document.createElement("a");
    a.download = "selbuvott-chart.pdf";
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  });

  // ---- boot ----
  load();
  stitchesInput.value = state.stitches;
  bodyRowsInput.value = state.bodyRows;
  mirrorInput.checked = state.mirror;
  renderSwatches();
  setSide(state.side, true);
  draw();
  window.addEventListener("resize", draw);
})();
</script>
</body>
</html>
